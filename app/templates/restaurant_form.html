{% extends "base.html" %}
{% block title %}{{ "Editar" if restaurant else "Nuevo" }} restaurante · FriendlyEats{% endblock %}
{% block content %}
<a class="back" href="{{ '/restaurants/' ~ restaurant.id if restaurant else '/' }}">← Cancelar</a>
<h1>{{ "Editar" if restaurant else "Nuevo" }} restaurante</h1>

<form id="restaurant-form" class="form"
      data-mode="{{ 'edit' if restaurant else 'create' }}"
      data-id="{{ restaurant.id if restaurant else '' }}">

  <label for="name">Nombre</label>
  <input id="name" name="name" required maxlength="100" value="{{ restaurant.name if restaurant else '' }}">

  <label for="category">Categoría</label>
  <input id="category" name="category" required maxlength="50" placeholder="Mexicana, Pizza, Sushi…"
         value="{{ restaurant.category if restaurant else '' }}">

  <label for="city">Ciudad</label>
  <input id="city" name="city" required maxlength="50" value="{{ restaurant.city if restaurant else '' }}">

  <label for="price">Precio</label>
  <select id="price" name="price" required>
    <option value="1" {{ "selected" if restaurant and restaurant.price == 1 }}>$</option>
    <option value="2" {{ "selected" if (restaurant and restaurant.price == 2) or not restaurant }}>$$</option>
    <option value="3" {{ "selected" if restaurant and restaurant.price == 3 }}>$$$</option>
  </select>

  <label for="photoUrl">URL de imagen (opcional)</label>
  <input id="photoUrl" name="photoUrl" type="url" placeholder="https://…"
         value="{{ restaurant.photoUrl if restaurant and restaurant.photoUrl else '' }}">

  <button class="btn btn-primary" type="submit">Guardar</button>
</form>

<p id="message" class="form-message" role="alert"></p>
{% endblock %}
